name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    name: Lint (ruff, black, ansible-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          ansible-galaxy collection install -r ansible/requirements.yml
      - name: ruff
        run: ruff check src tests
      - name: black
        run: black --check src tests
      - name: ansible-lint
        run: cd ansible && ansible-lint

  unit-tests:
    name: Unit Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Unit tests
        run: pytest tests -m "not integration and not validation" -q

  static-analysis:
    name: shellcheck + PSScriptAnalyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path scripts -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          if ($results) { $results | Format-Table -AutoSize | Out-String | Write-Host }
          $errors = $results | Where-Object Severity -eq 'Error'
          if ($errors) { throw "PSScriptAnalyzer found $($errors.Count) error(s)" }

  docker-e2e:
    name: Docker end-to-end
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The Makefile and the steps below use .venv/bin/labbench (same as local
      # dev and the Jenkinsfile), so install into a project venv here.
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e '.[dev]'
          .venv/bin/ansible-galaxy collection install -r ansible/requirements.yml
      - name: Lab up
        run: make lab-up
      - name: Provision
        run: .venv/bin/labbench provision
      - name: Attach
        run: .venv/bin/labbench attach
      - name: Validate
        run: .venv/bin/labbench validate || true
      - name: Collect
        run: .venv/bin/labbench collect
      - name: Report
        run: .venv/bin/labbench report || true
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: labbench-artifacts
          path: artifacts/
          if-no-files-found: warn
      - name: Lab down
        if: always()
        run: make lab-down || true
